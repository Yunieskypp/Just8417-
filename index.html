<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5d3a">
<title>Boxscore de pelota</title>
<style>
:root{--bg:#f3f5f0;--card:#fff;--ink:#14231a;--mut:#5d6b61;--line:#d5dcd3;--g:#1f5d3a;--gt:#fff;--ball:#2563a8;--str:#c2410c;--on:#e9b92f;--err:#8a1f1f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a13;--card:#18271d;--ink:#e8efe9;--mut:#9fb0a4;--line:#2c4033;--g:#3f9e68;--gt:#06140c;--ball:#6aa6ec;--str:#f08a4b;--on:#e9b92f;--err:#f08080}}
:root[data-theme="dark"]{--bg:#0f1a13;--card:#18271d;--ink:#e8efe9;--mut:#9fb0a4;--line:#2c4033;--g:#3f9e68;--gt:#06140c;--ball:#6aa6ec;--str:#f08a4b;--on:#e9b92f;--err:#f08080}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 Barlow,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:12px}
h1,h2,.num{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;margin:0}
h1{font-size:30px}h2{font-size:22px;margin-bottom:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
input,select{width:100%;font:inherit;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:14px 8px;background:var(--g);color:var(--gt);cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.97)}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.sm{padding:9px 12px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>.fit{flex:0 0 auto}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.board{background:var(--g);color:var(--gt);border-radius:10px;padding:10px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 12px}
.board .num{font-size:34px;line-height:1}.board .t{font-size:18px;align-self:center}
.sub{color:var(--mut);font-size:14px}
.dots{display:flex;gap:7px;align-items:center}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--mut)}
.dot.b.on{background:var(--ball);border-color:var(--ball)}.dot.s.on{background:var(--str);border-color:var(--str)}.dot.o.on{background:var(--on);border-color:var(--on)}
.cnt{display:flex;justify-content:space-between;gap:10px}
.big{font-size:48px;line-height:1}
.bb{background:var(--ball);color:#fff}.ss{background:var(--str);color:#fff}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 7px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
th{color:var(--mut);font-weight:600;font-size:14px}
.pl{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.x{background:transparent;color:var(--err);padding:2px 10px}
.seq{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.ch{min-width:26px;text-align:center;border-radius:6px;padding:2px 6px;font:700 15px "Barlow Condensed",sans-serif;color:#fff}
.cB{background:var(--ball)}.cS{background:var(--str)}.cF{background:var(--mut)}.cX{background:var(--g);color:var(--gt)}
button:disabled{opacity:.5}
.cH{background:var(--on);color:#14231a}
.kb{display:inline-block;transform:scaleX(-1)}
.board table{width:100%;border-collapse:collapse}.board th,.board td{border:0;padding:2px 6px;background:transparent;position:static;text-align:center;color:inherit}.board td:first-child,.board th:first-child{text-align:left;position:static;background:transparent}
.pd{padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}.pd .sub{display:block}
</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<main id="app"></main>
<script>
var g=null,stack=[],setup={away:{name:'Visitante',pit:[]},home:{name:'Local',pit:[]},N:6};
var app=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function save(){try{localStorage.setItem('bsp',JSON.stringify({g:g,setup:setup,stack:stack.slice(-60)}))}catch(e){}}
function load(){try{var d=JSON.parse(localStorage.getItem('bsp')||'null');if(d){g=d.g;setup=d.setup||setup;stack=d.stack||[]}}catch(e){}}
function mkP(n){return {n:n,p:0,b:0,s:0,k:0,bb:0,h:0,r:0,o:0}}
function off(){return g[g.half==='top'?'away':'home']}
function def(){return g[g.half==='top'?'home':'away']}
function pit(){var d=def();return d.pit[d.cur]}
function snap(){stack.push(JSON.stringify(g));if(stack.length>200)stack.shift()}

/* ---------- Setup ---------- */
function addSetupP(t){var el=document.getElementById('pn-'+t);var v=el.value.trim();if(!v)return;setup[t].pit.push(v);save();render()}
function delSetupP(t,i){setup[t].pit.splice(i,1);save();render()}

/* ---------- Acciones ---------- */
function endHalf(){
  g.outs=0;g.cnt={b:0,s:0};
  if(g.half==='top'){g.half='bottom'}
  else if(g.inn>=g.N){g.done=true}
  else{g.inn++;g.half='top'}
}
function doOut(){g.outs++;g.cnt={b:0,s:0};pit().o++;if(g.outs>=3)endHalf()}

function undo(){if(!stack.length)return;g=JSON.parse(stack.pop());save();render()}
function chPit(i){snap();def().cur=parseInt(i);save();render()}

function endGame(){snap();g.done=true;save();render()}
function resume(){snap();g.done=false;save();render()}

function tot(t){return t.runs.reduce(function(a,b){return a+(b||0)},0)}

/* ---------- Juego ---------- */
function dots(cls,n,max){var s='';for(var i=0;i<max;i++)s+='<span class="dot '+cls+(i<n?' on':'')+'"></span>';return s}

/* ---------- Final ---------- */
function ip(o){return Math.floor(o/3)+'.'+(o%3)}

function lineRow(t){
  var cells='';for(var i=0;i<g.inn;i++)cells+='<td>'+(t.runs[i]||0)+'</td>';
  return '<tr><td>'+esc(t.name)+'</td>'+cells+'<td><b>'+tot(t)+'</b></td><td>'+t.h+'</td><td>'+t.e+'</td></tr>';
}

function share(){
  var t=summary();
  try{if(navigator.share){navigator.share({text:t});return}}catch(e){}
  try{navigator.clipboard.writeText(t).then(function(){var b=document.getElementById('sh');if(b)b.textContent='Copiado'})}catch(e){}
}

function render(){
  if(!g)setupView();else if(g.done)finalView();else gameView();
  window.scrollTo(0,0);
}
/* ---------- Bateadores ---------- */
function mkB(n){return {n:n,pa:0,ab:0,h:0,r:0,rbi:0,bb:0,k:0,tb:0,p:0,b:0,s:0,f:0,pas:[]}}

function delS(t,k,i){setup[t][k].splice(i,1);save();render()}

function setupBlock(t,label){var s=setup[t];return '<div class="card"><h2>'+label+'</h2><input value="'+esc(s.name)+'" oninput="setup.'+t+'.name=this.value" aria-label="Nombre del equipo">'+lst(t,'bat','Alineación (en orden de bateo)','Nombre del bateador')+lst(t,'pit','Lanzadores (el primero abre el juego)','Nombre del lanzador')+'</div>'}
function rosterOk(){return ['away','home'].every(function(t){return setup[t].pit.length&&setup[t].bat.length})}
function setupView(){var ok=rosterOk();app.innerHTML='<h1>Nuevo juego</h1><p class="sub">Escribe cada equipo con su alineación y sus lanzadores.</p>'+setupBlock('away','Visitante')+setupBlock('home','Local')+'<div class="card"><label>Entradas del juego<input type="number" min="1" max="12" value="'+setup.N+'" oninput="setup.N=this.value"></label></div><button style="width:100%;font-size:18px"'+(ok?'':' disabled')+' onclick="start()">Empezar juego</button>'+(ok?'':'<p class="sub">Cada equipo necesita al menos un bateador y un lanzador.</p>')}
function start(){if(!rosterOk())return;var N=Math.max(1,parseInt(setup.N)||6);function T(t){return {name:setup[t].name.trim()||(t==='away'?'Visitante':'Local'),pit:setup[t].pit.map(mkP),bat:setup[t].bat.map(mkB),cur:0,ai:0,last:-1,runs:[],h:0,e:0}}g={away:T('away'),home:T('home'),inn:1,half:'top',outs:0,cnt:{b:0,s:0},seq:[],N:N,done:false};stack=[];save();render()}
function newGame(){g=null;stack=[];save();render()}
var _eh=endHalf;endHalf=function(){_eh();g.seq=[]};
function A(a){
 if(!g||g.done)return;
 snap();var o=off(),p=pit(),c=g.cnt,b=o.bat[o.ai],i=g.inn-1;
 function tr(ch){b.p++;if(ch==='B')b.b++;else if(ch==='S')b.s++;else if(ch==='F')b.f++;g.seq.push(ch)}
 function pa(r){b.pa++;b.pas.push({s:g.seq.join(''),r:r});g.seq=[];o.last=o.ai;o.ai=(o.ai+1)%o.bat.length;g.cnt={b:0,s:0}}
 function pt(){p.p++;p.s++}
 if(a==='ball'){p.p++;p.b++;c.b++;tr('B');if(c.b>=4){p.bb++;b.bb++;pa('BB')}}
 else if(a==='strike'){pt();c.s++;tr('S');if(c.s>=3){p.k++;b.k++;b.ab++;pa('K');doOut()}}
 else if(a==='foul'){pt();tr('F');if(c.s<2)c.s++}
 else if(/^h[1-4]$/.test(a)){var n=+a[1];pt();p.h++;o.h++;b.h++;b.ab++;b.tb+=n;tr('X');if(n===4){o.runs[i]=(o.runs[i]||0)+1;p.r++;b.r++;b.rbi++}pa(['','1B','2B','3B','HR'][n])}
 else if(a==='inplayout'){pt();tr('X');b.ab++;pa('Out');doOut()}
 else if(a==='error'){pt();tr('X');b.ab++;def().e++;pa('Error')}
 else if(a==='out'){doOut()}
 else if(a==='run'||a==='unrun'){var d=a==='run'?1:-1,cur=o.runs[i]||0;if(cur+d<0){stack.pop();return}o.runs[i]=cur+d;p.r=Math.max(0,p.r+d);var sc=document.getElementById('sc'),bi=sc?parseInt(sc.value):-1;if(bi>=0&&o.bat[bi])o.bat[bi].r=Math.max(0,o.bat[bi].r+d)}
 else if(a==='rbi'||a==='unrbi'){if(o.last<0){stack.pop();return}var q=o.bat[o.last];q.rbi=Math.max(0,q.rbi+(a==='rbi'?1:-1))}
 save();render()}
function chips(sq){return sq.map(function(c){return '<span class="ch c'+c+'">'+c+'</span>'}).join('')}
function boardHtml(){var n=g.inn,h='<div class="board" style="display:block;overflow-x:auto"><table><tr><th></th>';
 for(var i=1;i<=n;i++)h+='<th style="font-size:13px'+(i===n?';text-decoration:underline':'')+'">'+i+'</th>';
 h+='<th style="font-size:13px">C</th></tr>';
 [g.away,g.home].forEach(function(t,k){h+='<tr><td class="t" style="max-width:130px;overflow:hidden;text-overflow:ellipsis">'+esc(t.name)+'</td>';
  for(var i=0;i<n;i++){var pl=k===0||i<n-1||g.half==='bottom';h+='<td>'+(pl?(t.runs[i]||0):'')+'</td>'}
  h+='<td class="num">'+tot(t)+'</td></tr>'});
 return h+'</table></div>'}
function gameView(){
 var o=off(),d=def(),p=pit(),b=o.bat[o.ai],nx=o.bat[(o.ai+1)%o.bat.length],lb=o.last>=0?o.bat[o.last]:null;
 app.innerHTML=
 boardHtml()
 +'<div class="card" style="margin-top:12px"><div class="row"><div><b>'+(g.half==='top'?'Alta':'Baja')+' de la '+g.inn+'ª</b><div class="sub">Batea '+esc(o.name)+'</div></div><div style="flex:0 0 auto"><div class="sub">Outs</div><div class="dots">'+dots('o',g.outs,3)+'</div></div></div></div>'
 +'<div class="card"><div class="sub">Al bate, turno '+(b.pa+1)+'</div><div class="num" style="font-size:30px">'+esc(b.n)+'</div><div class="sub">Hoy '+b.h+'-'+b.ab+', '+b.p+' lanzamientos recibidos. Sigue '+esc(nx.n)+'.</div>'
 +'<div class="seq">'+(g.seq.length?chips(g.seq):'<span class="sub">Sin lanzamientos todavía</span>')+'</div>'
 +'<div class="cnt" style="margin-top:10px"><div><div class="sub">Bolas</div><div class="dots">'+dots('b',g.cnt.b,3)+'</div></div><div><div class="sub">Strikes</div><div class="dots">'+dots('s',g.cnt.s,2)+'</div></div></div></div>'
 +'<div class="grid"><button class="bb" onclick="A(\'ball\')">Bola</button><button class="ss" onclick="A(\'strike\')">Strike</button><button class="alt" onclick="A(\'foul\')">Foul</button>'
 +'<button onclick="A(\'h1\')">Sencillo</button><button onclick="A(\'h2\')">Doble</button><button onclick="A(\'h3\')">Triple</button>'
 +'<button onclick="A(\'h4\')">Jonrón</button><button class="alt" onclick="A(\'inplayout\')">Out en juego</button><button class="alt" onclick="A(\'error\')">Error</button></div>'
 +'<div class="card" style="margin-top:12px"><div class="sub">Lanza '+esc(d.name)+'</div><div class="row" style="margin:6px 0"><select onchange="chPit(this.value)" aria-label="Lanzador actual">'+d.pit.map(function(x,j){return '<option value="'+j+'"'+(j===d.cur?' selected':'')+'>'+esc(x.n)+'</option>'}).join('')+'</select></div>'
 +'<div class="row" style="text-align:center"><div><div class="num big">'+p.p+'</div><div class="sub">lanzamientos</div></div><div><div class="num big" style="color:var(--ball)">'+p.b+'</div><div class="sub">bolas</div></div><div><div class="num big" style="color:var(--str)">'+p.s+'</div><div class="sub">strikes</div></div></div>'
 +'<div class="row" style="margin-top:10px"><input id="np" placeholder="Lanzador nuevo"><button class="fit sm alt" onclick="addGame()">Agregar</button></div></div>'
 +'<div class="row"><button class="alt" onclick="undo()">Deshacer</button><button class="alt" onclick="endGame()">Terminar juego</button></div>'
 +'<p class="sub">Cada lanzamiento queda anotado al bateador: B bola, S strike, F foul, X bola en juego. Strike 3 es ponche y bola 4 es base por bolas.</p>';
}
function avg(h,ab){return ab?(h/ab).toFixed(3).replace(/^0/,''):'.---'}

function finalView(){
 var w=tot(g.away)>tot(g.home)?g.away.name:tot(g.home)>tot(g.away)?g.home.name:null;
 var head='<th>Equipo</th>';for(var i=1;i<=g.inn;i++)head+='<th>'+i+'</th>';
 app.innerHTML='<h1>Final del juego</h1><p class="sub">'+(w?'Ganó '+esc(w):'Empate')+'</p>'
 +'<div class="card"><h2>Pizarra</h2><div class="tbl"><table><tr>'+head+'<th>C</th><th>H</th><th>E</th></tr>'+lineRow(g.away)+lineRow(g.home)+'</table></div></div>'
 +batTable(g.away)+batTable(g.home)+pitTable(g.away)+pitTable(g.home)+paBlock(g.away)+paBlock(g.home)
 +'<p class="sub">Bateadores: VB veces al bate, H hits, C carreras anotadas, CI impulsadas, BB bases por bolas, K ponches, PRO promedio, Lanz lanzamientos recibidos. Lanzadores: IP entradas, Lanz lanzamientos, B bolas, S strikes, K ponches, BB bases por bolas, H hits, CP carreras permitidas, CL limpias, CS sucias, %S porcentaje de strikes. Turnos: B bola, S strike, F foul, X bola en juego.</p>'
 +'<div class="row"><button id="sh" onclick="share()">Compartir resumen</button><button class="alt" onclick="resume()">Seguir jugando</button></div>'
 +'<button class="alt" style="width:100%;margin-top:8px" onclick="newGame()">Nuevo juego</button>';
}

/* ---------- Golpeado, sacrificios, robos, sustituciones ---------- */
function outKeep(){var c0={b:g.cnt.b,s:g.cnt.s};doOut();if(g.outs>0)g.cnt=c0}
var _A=A;
A=function(a){
 if(!g||g.done)return;
 if(['hbp','sacf','sach','sb','cs','out'].indexOf(a)<0)return _A(a);
 var o=off(),p=pit(),b=o.bat[o.ai],rn=document.getElementById('rn'),ri=rn?parseInt(rn.value):-1;
 if((a==='sb'||a==='cs')&&!(ri>=0&&o.bat[ri]))return;
 snap();
 function tr(ch){b.p++;g.seq.push(ch)}
 function pa(r){b.pa++;b.pas.push({s:g.seq.join(''),r:r});g.seq=[];o.last=o.ai;o.ai=(o.ai+1)%o.bat.length;g.cnt={b:0,s:0}}
 if(a==='hbp'){p.p++;p.b++;tr('H');b.hbp=(b.hbp||0)+1;pa('Golpeado')}
 else if(a==='sacf'||a==='sach'){p.p++;p.s++;tr('X');if(a==='sacf')b.sf=(b.sf||0)+1;else b.sh=(b.sh||0)+1;pa(a==='sacf'?'Sac. elevado':'Sac. toque');doOut()}
 else if(a==='sb'){var r=o.bat[ri];r.sb=(r.sb||0)+1}
 else if(a==='cs'){var r2=o.bat[ri];r2.cs=(r2.cs||0)+1;outKeep()}
 else{outKeep()}
 save();render()};

var _gv=gameView;
gameView=function(){
 _gv();
 var o=off(),opts=o.bat.map(function(x,j){return '<option value="'+j+'">'+esc(x.n)+'</option>'}).join('');
 var h='<details class="card" style="margin-top:12px"><summary><b>Cambiar bateador</b></summary><div class="sub" style="margin-top:8px">El que sale conserva sus estadísticas.</div><select id="ss" style="margin:6px 0" aria-label="Bateador que sale">'+o.bat.map(function(x,j){return '<option value="'+j+'"'+(j===o.ai?' selected':'')+'>'+(j+1)+'. '+esc(x.n)+'</option>'}).join('')+'</select><div class="row"><input id="sn" placeholder="Nombre del que entra"><button class="fit sm" onclick="subB()">Sustituir</button></div></details>';
 var rows=app.querySelectorAll(':scope > .row');
 rows[rows.length-1].insertAdjacentHTML('beforebegin',h);
};
function all(t){return t.bat.concat((t.gone||[]).filter(function(b){return b.pa||b.p||b.r||b.rbi||b.sb||b.cs}))}
function batTable(t){return '<div class="card"><h2>Bateadores de '+esc(t.name)+'</h2><div class="tbl"><table><tr><th>Bateador</th><th>VB</th><th>H</th><th>C</th><th>CI</th><th>BB</th><th>K</th><th>PRO</th><th>GO</th><th>SAC</th><th>BR</th><th>CR</th><th>Lanz</th></tr>'+all(t).map(function(b){return '<tr><td>'+esc(b.n)+(b.out?' (salió)':'')+'</td><td>'+b.ab+'</td><td>'+b.h+'</td><td>'+b.r+'</td><td>'+b.rbi+'</td><td>'+b.bb+'</td><td>'+b.k+(b.k?' ('+(b.kl||0)+'<span class="kb">K</span> '+(b.ks||0)+'K)':'')+'</td><td>'+avg(b.h,b.ab)+'</td><td>'+(b.hbp||0)+'</td><td>'+((b.sf||0)+(b.sh||0))+'</td><td>'+(b.sb||0)+'</td><td>'+(b.cs||0)+'</td><td>'+b.p+'</td></tr>'}).join('')+'</table></div></div>'}

var _fv=finalView;
finalView=function(){
 _fv();
 var r=app.querySelectorAll(':scope > .row');
 r[r.length-1].insertAdjacentHTML('beforebegin','<p class="sub">GO golpeado, SAC sacrificios, BR bases robadas, CR atrapado robando. En los turnos, H es golpeado. En ponches, K es tirándole y <span class="kb">K</span> (K al revés) es cantado, mirando.</p>');
};
function summary(){var s=g.away.name+' '+tot(g.away)+' - '+tot(g.home)+' '+g.home.name+'\n';[g.away,g.home].forEach(function(t){s+='\nBateadores de '+t.name+':\n';all(t).forEach(function(b){s+=b.n+': '+b.h+'-'+b.ab+', '+b.r+' C, '+b.rbi+' CI, '+b.bb+' BB, '+b.k+' K ('+(b.kl||0)+' ꓘ, '+(b.ks||0)+' K), '+(b.sb||0)+' BR, '+b.p+' lanz\n'});s+='\nLanzadores de '+t.name+':\n';t.pit.forEach(function(p){if(p.p||p.o||p.r)s+=p.n+': '+ip(p.o)+' IP, '+p.p+' lanz ('+p.b+' B, '+p.s+' S), '+p.k+' K, '+p.bb+' BB, '+p.h+' H, '+p.r+' CP\n'})});return s}
/* ---------- Números de jugador y tipo de ponche ---------- */
function nm(n,v){v=(v||'').trim().replace(/^#/,'');n=n.trim();return v?'#'+v+' '+n:n}
function addS(t,k){var el=document.getElementById('pn-'+k+'-'+t),nu=document.getElementById('pm-'+k+'-'+t),v=el.value.trim();if(!v)return;setup[t][k].push(nm(v,nu?nu.value:''));save();render()}

function addGame(){var el=document.getElementById('np'),nu=document.getElementById('npn'),v=el.value.trim();if(!v)return;snap();def().pit.push(mkP(nm(v,nu?nu.value:'')));def().cur=def().pit.length-1;save();render()}
function subB(){var o=off(),idx=parseInt(document.getElementById('ss').value),n=document.getElementById('sn').value.trim(),nu=document.getElementById('snn');if(!n||!o.bat[idx])return;snap();o.gone=o.gone||[];var old=o.bat[idx];old.out=true;o.gone.push(old);o.bat[idx]=mkB(nm(n,nu?nu.value:''));save();render()}
var askK=false;
var _A2=A;
A=function(a){
 if(!g||g.done)return;
